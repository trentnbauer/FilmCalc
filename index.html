<!DOCTYPE html>
<html lang="en">
<head>
    <!-- AdSense site verification — Google requires this exact snippet in
         every page's <head>. The build-github-page.yml workflow
         sed-replaces %%ADSENSE_CLIENT_ID%% from a repo secret; the
         Docker/self-hosted build never runs that step, so the token stays
         literal here and this bails out before requesting anything from
         Google — no ad script for self-hosted users. -->
    <script>
        (function () {
            var client = "%%ADSENSE_CLIENT_ID%%";
            if (!client || client.indexOf('%%') === 0) return;
            var loader = document.createElement('script');
            loader.async = true;
            loader.crossOrigin = 'anonymous';
            loader.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + encodeURIComponent(client);
            document.head.appendChild(loader);
        })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#0b0b0c">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FilmCalc — Film Cost Calculator</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --acc: #ff7a2f; }
        body { margin: 0; background: #0b0b0c; font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        a { color: var(--acc); text-decoration: none; }
        a:hover { color: #ffa268; text-decoration: underline; }
        input, select, button { font-family: inherit; }
        input::placeholder { color: #55534e; }
        input:focus, select:focus { outline: 1px solid var(--acc); outline-offset: 0; }
        button:hover { filter: brightness(1.15); }
        /* Above this width there's room for a real toolbar and multi-field
           rows, so the single markup tree (js/app.js's renderMobile()) grows
           a desktop-style nav and lets its field rows sit side by side
           instead of one-per-line — same markup, CSS-only rearrangement, so
           there's no second layout to fall out of sync with this one. */
        @media (min-width: 720px) {
            .desktop-nav { display: flex !important; margin-left: auto; }
            .hamburger-btn, .mobile-view-label { display: none !important; }
            .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); background: #212125; gap: 1px; }
            .field-grid > .m-row { background: #131315; border-top: 0 !important; }
            .field-grid > button, .field-grid > div:not(.m-row) { grid-column: 1 / -1; }
        }
    </style>
    <!-- js-yaml: parses options.yaml, the self-hosted config.yaml, and the
         films/labs region preset files. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" integrity="sha512-CSBhVREyzHAjAFfBlIBakjoRUKp5h7VSweP0InR/pAJyptH7peuhCsqAI/snV+TwZmXZqoUklpXp6R6wMnYf5Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <div id="app"></div>

    <!-- i18n: STRINGS dictionary + t()/setLocale() helpers. Must load
         before js/app.js, which calls t() directly inside its render
         functions rather than the old data-i18n attribute hydration. -->
    <script src="js/i18n.js"></script>
    <!-- Dev Cost / Per ISO calculation engine — pure global functions, no
         DOM, no localStorage. Must load before js/app.js, which calls
         these directly rather than duplicating the maths. See
         tests/dev-cost-calc.test.js. -->
    <script src="js/dev-cost-calc.js"></script>
    <!-- App shell: state, rendering, and every event handler, built for
         the "FilmCalc Redesign" mockup. See the file's own header comment
         for what carried over from the previous UI and what didn't. -->
    <script src="js/app.js"></script>
</body>
</html>
