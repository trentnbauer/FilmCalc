<!DOCTYPE html>
<html lang="en">
<head>
    <!-- AdSense site verification — see js/adsense-loader.js for what this
         does and why it's an external file rather than inline. -->
    <script src="js/adsense-loader.js"></script>
    <!-- Content-Security-Policy: script-src/frame-src/connect-src carry the
         AdSense/Google ad-tech domains (script-src also needs them because
         adsbygoogle.js itself, running in this document, issues the ad
         request before any iframe exists) — those wildcards are Google's
         own documented CSP requirement for AdSense, not a general
         allowance. Everything else is locked to 'self' plus the two CDNs
         this page actually loads from (cdnjs for js-yaml, Google Fonts).
         script-src also needs 'unsafe-inline': js/app.js renders the whole
         UI as onclick/oninput/onchange attribute strings (no framework, no
         addEventListener wiring — see app.js's own header comment), so
         blocking inline handlers would break every control in the app.
         That means script-src can't fully stop injected script from
         *running* the way default-src normally would; what it still buys
         is real: connect-src/frame-src/img-src keep injected script from
         *exfiltrating* to an arbitrary attacker origin (only these ad
         domains and 'self' are reachable), and object-src/base-uri/
         form-action close the plugin/<base>-hijack/form-exfil escape
         hatches. The primary defense against the DOM XSS this app is
         actually exposed to (imported YAML, see security.md) stays
         output encoding — escapeHtml()/sanitizeUrl() in app.js — this
         header is defense in depth on top of that, not a replacement.
         GitHub Pages (the only hosting this app has, since #315 dropped
         Docker self-hosting) serves no custom headers, so a <meta> tag is
         the only way to deliver this at all — frame-ancestors/report-uri/
         X-Frame-Options aren't available in either form here. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://www.googletagservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.googlesyndication.com https://*.google.com https://*.doubleclick.net; frame-src https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0b0b0c">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FilmCalc — Film Cost Calculator</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --acc: #ff7a2f; }
        body { margin: 0; background: #0b0b0c; font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        a { color: var(--acc); text-decoration: none; }
        a:hover { color: #ffa268; text-decoration: underline; }
        input, select, button { font-family: inherit; }
        input::placeholder { color: #55534e; }
        input:focus, select:focus { outline: 1px solid var(--acc); outline-offset: 0; }
        button:hover { filter: brightness(1.15); }
        .lib-grid { display: flex; flex-direction: column; gap: 8px; }
        /* Above this width there's room for a real toolbar and multi-field
           rows, so the single markup tree (js/app.js's renderMobile()) grows
           a desktop-style nav and lets its field rows sit side by side
           instead of one-per-line — same markup, CSS-only rearrangement, so
           there's no second layout to fall out of sync with this one. */
        @media (min-width: 720px) {
            .desktop-nav { display: flex !important; margin-left: auto; }
            .hamburger-btn, .mobile-view-label { display: none !important; }
            .field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); background: #212125; gap: 1px; }
            .field-grid > .m-row { background: #131315; border-top: 0 !important; }
            .field-grid > button, .field-grid > div:not(.m-row), .field-grid > .m-row-wide { grid-column: 1 / -1; }
            .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
        }
    </style>
    <!-- js-yaml: parses options.yaml and the films/labs region preset files. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" integrity="sha512-CSBhVREyzHAjAFfBlIBakjoRUKp5h7VSweP0InR/pAJyptH7peuhCsqAI/snV+TwZmXZqoUklpXp6R6wMnYf5Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <div id="app"></div>

    <!-- i18n: STRINGS dictionary + t()/setLocale() helpers. Must load
         before js/app.js, which calls t() directly inside its render
         functions rather than the old data-i18n attribute hydration. -->
    <script src="js/i18n.js"></script>
    <!-- Dev Cost / Per ISO calculation engine — pure global functions, no
         DOM, no localStorage. Must load before js/app.js, which calls
         these directly rather than duplicating the maths. See
         tests/dev-cost-calc.test.js. -->
    <script src="js/dev-cost-calc.js"></script>
    <!-- Import validation: checks custom-uploaded film/lab YAML against
         schema/film-lab-schema.json before it's merged into localStorage.
         Must load before js/app.js, which calls its functions directly. -->
    <script src="js/data-validate.js"></script>
    <!-- App shell: state, rendering, and every event handler, built for
         the "FilmCalc Redesign" mockup. See the file's own header comment
         for what carried over from the previous UI and what didn't. -->
    <script src="js/app.js"></script>
</body>
</html>
