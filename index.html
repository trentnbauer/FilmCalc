<!DOCTYPE html>
<html lang="en">
<head>
    <!-- AdSense site verification — see js/adsense-loader.js for what this
         does and why it's an external file rather than inline. -->
    <script src="js/adsense-loader.js"></script>
    <!-- Content-Security-Policy: script-src/frame-src/connect-src carry the
         AdSense/Google ad-tech domains (script-src also needs them because
         adsbygoogle.js itself, running in this document, issues the ad
         request before any iframe exists) — those wildcards are Google's
         own documented CSP requirement for AdSense, not a general
         allowance. googletagmanager.com/google-analytics.com are Google's
         own documented CSP requirement for GA4 (gtag.js), same reasoning —
         script-src needs the loader script's own origin, connect-src needs
         the collect-request domains it calls after loading. Everything
         else is locked to 'self' plus the two CDNs this page actually
         loads from (cdnjs for js-yaml, Google Fonts). script-src also
         needs 'unsafe-inline': js/app.js renders the whole UI as
         onclick/onchange attribute strings (no framework, no
         addEventListener wiring — see app.js's own header comment), so
         blocking inline handlers would break every control in the app.
         That means script-src can't fully stop injected script from
         *running* the way default-src normally would; what it still buys
         is real: connect-src/frame-src/img-src keep injected script from
         *exfiltrating* to an arbitrary attacker origin (only these ad/
         analytics domains and 'self' are reachable), and object-src/
         base-uri/form-action close the plugin/<base>-hijack/form-exfil
         escape hatches. The primary defense against the DOM XSS this app
         is actually exposed to (imported YAML, see security.md) stays
         output encoding — escapeHtml()/sanitizeUrl() in app.js — this
         header is defense in depth on top of that, not a replacement.
         GitHub Pages (the only hosting this app has, since #315 dropped
         Docker self-hosting) serves no custom headers, so a <meta> tag is
         the only way to deliver this at all — frame-ancestors/report-uri/
         X-Frame-Options aren't available in either form here. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://www.googletagservices.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.googlesyndication.com https://*.google.com https://*.doubleclick.net https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-src https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="description" content="Work out the true cost per photo of shooting film, and which lab is actually cheapest for a given roll.">
    <link rel="canonical" href="https://filmcalc.app/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://filmcalc.app/">
    <meta property="og:title" content="FilmCalc — Film Cost Calculator">
    <meta property="og:description" content="Work out the true cost per photo of shooting film, and which lab is actually cheapest for a given roll.">
    <meta property="og:image" content="https://filmcalc.app/icon-512.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="FilmCalc — Film Cost Calculator">
    <meta name="twitter:description" content="Work out the true cost per photo of shooting film, and which lab is actually cheapest for a given roll.">
    <meta name="twitter:image" content="https://filmcalc.app/icon-512.png">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --acc: #ff7a2f; }
        body { margin: 0; background: #08090a; font-family: 'Public Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        a { color: #5fa8d3; text-decoration: none; }
        a:hover { color: #8cc4e4; }
        input, select, button { font-family: inherit; }
        input::placeholder { color: #4a4f57; }
        input[type=range] { accent-color: #ff7a2f; }
        button:hover { filter: brightness(1.12); }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: #26292e; border-radius: 6px; }
        /* Depth tab's "recommended stop" sheen — the gold aperture-ladder tile. */
        @keyframes recSheen { 0% { background-position: 220% 0; } 100% { background-position: -60% 0; } }
    </style>
    <!-- js-yaml: parses the films/labs region preset files, and options.yaml. -->

    <!-- qrcode-generator: renders the share-link QR in the Share sheet. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
<div id="app"></div>

<!-- Google Analytics (GA4) — opt-in only, gated behind the cookie-consent
     banner. See js/ga-loader.js's own header comment and privacy.html for
     what this does and doesn't send before consent. -->
<script src="js/ga-loader.js"></script>
<!-- Dev Cost / Per ISO calculation engine — pure global functions, no DOM,
     no localStorage. Must load before js/app.js, which calls these
     directly rather than duplicating the maths. See
     tests/dev-cost-calc.test.js. -->
<script src="js/dev-cost-calc.js"></script>
<!-- Import validation: checks custom-uploaded film/lab YAML against
     schema/film-lab-schema.json before it's merged into localStorage. Must
     load before js/app.js, which calls its functions directly. -->
<script src="js/data-validate.js"></script>
<!-- IANA timezone -> country name table, used as the geo-detect fallback
     for the Setup wizard's starter-presets pre-tick when Geolocation is
     denied/unavailable. Must load before js/app.js, which reads
     TZ_COUNTRY directly. -->
<script src="js/tz-country.js"></script>
<!-- STRINGS dictionary + t()/setLocale()/currentLocale. Must load before
     js/app.js, which calls t() directly inside its render functions. -->
<script src="js/i18n.js"></script>
<!-- App shell: state, rendering, and every event handler — the "FilmCalc
     3.0" redesign, developed at /new/ and promoted to replace the
     previous UI here. See the file's own header comment for what carried
     over and what changed in the move. -->
<script src="js/app.js"></script>
</body>
</html>
