# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Workflow actions (actions/checkout, actions/setup-node, etc.) — the only
  # dependency surface this repo has. No npm/docker ecosystem: there's no
  # package.json, and Docker self-hosting was dropped in #315.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
