name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Stamp build version into index.html and sw.js
        # sw.js's cache name uses the same token so every deploy gets its
        # own service-worker cache for free, without a separate version
        # bump step.
        run: |
          sed -i "s/%%FILMCALC_VERSION%%/$(git rev-parse --short HEAD)/" index.html
          sed -i "s/%%FILMCALC_VERSION%%/$(git rev-parse --short HEAD)/" sw.js
      - name: Stamp AdSense IDs into js/adsense-loader.js and ads.txt
        # Pages-only monetization. ADSENSE_CLIENT_ID/ADSENSE_SLOT_ID are repo
        # secrets (Settings → Secrets and variables → Actions) from the
        # AdSense dashboard — not sensitive, just kept out of the committed
        # source so a self-hosted build (which never runs this step) can't
        # pick them up. Unset secrets substitute to an empty string, which
        # js/adsense-loader.js's guard also treats as "no ad" — safe default
        # until both secrets are added. -g is a no-op today (each token
        # appears once per line) but keeps this correct if the token ever
        # shows up twice on one line.
        # The client id lives in js/adsense-loader.js rather than inline in
        # index.html so the page's CSP can use a plain script-src allowlist
        # instead of an inline-script hash that would differ before/after
        # this substitution (see index.html's CSP <meta> comment).
        # ads.txt is Pages-only monetization, same as the AdSense script itself —
        # self-hosted deployments have no reason to serve it at all, so it doesn't
        # need the same "stays literal" guard the loader script relies on. ads.txt
        # then has its ca- prefix stripped: ADSENSE_CLIENT_ID is the ca-pub-...
        # form the adsbygoogle script/data-ad-client need, but Google's ads.txt spec
        # wants the bare pub-... form (see Google's own ads.txt setup instructions) -
        # using the same secret verbatim there produces a line the AdSense crawler
        # won't match, which silently breaks site verification.
        run: |
          sed -i "s/%%ADSENSE_CLIENT_ID%%/${{ secrets.ADSENSE_CLIENT_ID }}/g" js/adsense-loader.js
          sed -i "s/%%ADSENSE_SLOT_ID%%/${{ secrets.ADSENSE_SLOT_ID }}/g" js/adsense-loader.js
          sed -i "s/%%ADSENSE_CLIENT_ID%%/${{ secrets.ADSENSE_CLIENT_ID }}/g" ads.txt
          sed -i 's/, ca-pub-/, pub-/' ads.txt
      - name: Generate changelog.json
        # Footer "What's new" popup (issue #53) reads this at runtime.
        # Regenerated into the working tree, not committed back — the
        # checked-in changelog.json is just the fallback for anyone running
        # this from a local checkout without CI. See
        # .github/scripts/generate-changelog.py for the generator itself.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/generate-changelog.py --repo "${{ github.repository }}"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage site files
        # The actual static app, plus films/ and labs/ — the Settings →
        # Import modal fetches films/index.json and labs/index.json (and
        # whatever preset files they list) at runtime, so those folders
        # need to be live on the deployed site, not just present in the repo.
        # Both index.json files are committed as-is, generated by
        # sync-preset-index.yml instead of here — an earlier version of this
        # step regenerated them at deploy time with a generator that only
        # ever knew about `label:`, which silently stripped the
        # `country`/`state`/`city` fields films/labs entries grew for the
        # region tree (issue #114/#116) on every deploy, no matter what was
        # actually committed. js/ is index.html's own calculation engine
        # (issue #61), loaded via <script src> — also needs to be live, not
        # just present in the repo. ads.txt (AdSense site verification,
        # issue #181 follow-up) is Pages-only monetization, same as the
        # AdSense script itself — irrelevant to anyone self-hosting.
        # Docs and packaging files (README, CONTRIBUTING) still don't
        # belong here. schema/ (film-lab-schema.json) is fetched at runtime
        # by js/data-validate.js, same reason films/labs need to be live.
        # manifest.json (PWA installability) is linked from index.html's
        # <head>, so it needs to be live at the same path too, along with
        # icon-192.png/icon-512.png — the PNG sizes Chrome actually
        # requires for the install prompt (icon.svg's sizes="any" entry
        # looks sufficient but isn't, on its own, enough to satisfy
        # Chrome's installability check). sw.js (offline app-shell cache,
        # see its own header comment) is registered from js/app.js at
        # '/sw.js', so it needs to be live at the site root too, not
        # nested under js/. robots.txt/sitemap.xml are read directly by
        # crawlers at the site root.
        # (css/ + Tailwind build step removed: index.html hasn't loaded
        # css/tailwind.css since the redesign to inline styles — it was
        # dead weight nobody was linking to.)
        run: |
          mkdir -p _site
          cp index.html sw.js favicon.ico icon.ico icon.svg icon-192.png icon-512.png apple-touch-icon.png manifest.json options.yaml changelog.json ads.txt robots.txt sitemap.xml _site/
          cp -r films labs schema js _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
