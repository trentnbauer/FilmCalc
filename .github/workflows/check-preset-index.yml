name: Keep preset index in sync on PRs

# films/index.json and labs/index.json are the manifest the app fetches to
# discover which preset files exist (static hosting has no real directory
# listing). Their content — file, label, country, state, city — all comes
# from each YAML file's own top-level fields, so contributors only ever
# need to touch the YAML.
#
# Replaces the old push-triggered sync-preset-index.yml, which regenerated
# the manifests AFTER a preset PR merged and opened a second, bot-authored
# PR for just the index files. That second PR was reliably stuck BLOCKED by
# this repo's branch ruleset (require_extra_approval_for_unattributed_changes
# — an extra human review for any PR whose changes come from an
# unattributed/bot push), needing a manual approval every single time. This
# workflow instead checks the index during the ORIGINAL preset PR and, if
# it's stale, commits the fix straight onto that PR's own branch — one PR
# per preset change instead of two, and (for a same-repo branch, i.e. not a
# fork) no second bot-authored PR to get blocked.
on:
  pull_request:
    paths:
      - "films/**.yaml"
      - "films/**.yml"
      - "labs/**.yaml"
      - "labs/**.yml"

permissions:
  contents: write

jobs:
  check-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Regenerate films/index.json and labs/index.json from the YAML files
        run: |
          python3 - <<'PY'
          import glob, json, yaml

          def build_index(folder):
              entries = []
              for path in sorted(glob.glob(f"{folder}/*.yaml") + glob.glob(f"{folder}/*.yml")):
                  doc = yaml.safe_load(open(path, encoding="utf-8"))
                  if not isinstance(doc, dict):
                      continue
                  filename = path.split("/")[-1]
                  entry = {"file": filename, "label": doc.get("label") or filename}
                  for key in ("country", "state", "city"):
                      if doc.get(key):
                          entry[key] = doc[key]
                  entries.append(entry)
              return entries

          for folder in ("films", "labs"):
              entries = build_index(folder)
              with open(f"{folder}/index.json", "w", encoding="utf-8", newline="\n") as f:
                  json.dump(entries, f, indent=2)
                  f.write("\n")
          PY

      - name: Commit the fix onto this PR's branch if the manifests are stale
        run: |
          if git diff --quiet -- films/index.json labs/index.json; then
            echo "Manifests already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add films/index.json labs/index.json
          git commit -m "chore: sync films/index.json and labs/index.json"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"

      - name: Fork PRs can't be pushed to by this workflow — fail with instructions instead
        # A pull_request-event GITHUB_TOKEN is read-only against a fork's
        # branch no matter what permissions this workflow requests (a hard
        # GitHub restriction), so the push step above silently can't apply
        # there. This step only reaches a fork PR with a genuinely stale
        # index (the push step already succeeded and exited for everything
        # else), and fails loudly so the contributor knows to fix it rather
        # than merging a preset with a stale manifest.
        if: failure() && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::films/index.json and/or labs/index.json are out of date and this PR is from a fork, so this workflow can't push the fix directly. Run the regeneration script locally (see .github/workflows/check-preset-index.yml) and push the updated index files to this PR branch yourself."
          exit 1
