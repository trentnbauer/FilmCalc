name: Monthly Price Audit

# Opens this month's price-audit draft PRs (one per films/*.yaml or labs/*.yaml file) on
# the 1st of every month. Each PR starts as an empty-diff draft carrying a checklist in
# its body — nothing here verifies any prices itself. Tier 5 of daily-claude-run.yml works
# through the checklists a few items a night over the rest of the month, committing any
# fix straight onto each PR's own branch as it goes, since fetching and checking every
# film/lab price in one run would blow well past a single Claude Code session's budget.
# Runs at 14:00 UTC, half an hour before that nightly job's own 15:00 UTC schedule, so the
# freshly opened PRs are already there the first time it looks for them.
#
# PRs instead of issues (this workflow used to open issues, then Tier 5 batched its
# findings into a separate PR only once a whole file's checklist was done): using the PR
# itself as the running checklist means a fix lands on the branch the moment it's
# confirmed, instead of sitting as a comment waiting to be collected later, and there's
# one artifact per file instead of two.
on:
  schedule:
    - cron: '0 14 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  open-audit-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configure git identity
        # Needed for the empty commit each price-audit branch starts with —
        # see .github/scripts/generate-price-audit-issues.py.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure tracking labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "price-audit" \
            --repo ${{ github.repository }} \
            --color "0e8a16" \
            --description "Monthly film/lab price audit checklist for one data file (Tier 5 of daily-claude-run.yml)." \
            --force
          gh label create "price-audit-flag" \
            --repo ${{ github.repository }} \
            --color "d93f0b" \
            --description "A price-audit entry Claude couldn't verify. Reply with the correct value and mention @claude." \
            --force

      - name: Skip if a batch is in progress or this month's already ran
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_count=$(gh pr list --repo ${{ github.repository }} --label price-audit --state open --json number -q 'length')
          if [ "$open_count" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$open_count price-audit PR(s) still open — not starting a new batch this month."
            exit 0
          fi

          # Even with nothing open, this month's batch may already have run and been
          # fully closed/merged (e.g. a manual workflow_dispatch after the scheduled run
          # already finished) — the open-count check alone can't see that and would just
          # open a second, duplicate batch of identically-titled PRs. Guard against that
          # by checking whether any price-audit PR, in any state, was already titled for
          # the current month.
          month=$(date -u +'%B %Y')
          existing=$(gh pr list --repo ${{ github.repository }} --label price-audit --state all \
            --search "\"— ${month}\" in:title" --json number -q 'length')
          if [ "$existing" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$existing price-audit PR(s) already exist for ${month} — not opening a duplicate batch."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open this month's price-audit PRs
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/generate-price-audit-issues.py
