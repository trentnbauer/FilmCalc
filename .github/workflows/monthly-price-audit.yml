name: Monthly Price Audit

# Opens price-audit checklist issues (one per films/*.yaml or labs/*.yaml file) on the 1st
# of every month, and can also be triggered manually anytime (Actions tab → Run workflow)
# — e.g. right after adding a new city's preset files mid-month, rather than waiting for
# next month's scheduled run to pick them up. Nothing here verifies any prices itself —
# Tier 5 of daily-claude-run.yml works through the checklists a few items a night over the
# following nights, since fetching and checking every film/lab price in one run would blow
# well past a single Claude Code session's budget. The scheduled run fires at 14:00 UTC,
# half an hour before that nightly job's own 15:00 UTC schedule, so the freshly opened
# issues are already there the first time it looks for them.
#
# Safe to run more than once a month: generate-price-audit-issues.py skips any file that
# already has an open price-audit issue, so a re-run — scheduled or manual — only opens
# issues for files that don't have one yet, never a duplicate checklist for a file whose
# first one is still being worked through.
on:
  schedule:
    - cron: '0 14 1 * *'
  workflow_dispatch:

# Now that this can run anytime (not just once a month), two overlapping runs (a manual
# trigger landing near the scheduled one, or someone clicking "Run workflow" twice) could
# otherwise both see the same file as "not yet audited" and each open a duplicate issue
# for it — the per-file check in generate-price-audit-issues.py only protects against
# sequential re-runs, not concurrent ones. Serializing on one group closes that gap.
concurrency:
  group: monthly-price-audit
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  open-audit-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Ensure tracking labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "price-audit" \
            --repo ${{ github.repository }} \
            --color "0e8a16" \
            --description "Monthly film/lab price audit checklist for one data file (Tier 5 of daily-claude-run.yml)." \
            --force
          gh label create "price-audit-flag" \
            --repo ${{ github.repository }} \
            --color "d93f0b" \
            --description "A price-audit entry Claude couldn't verify. Reply with the correct value and mention @claude." \
            --force

      - name: Open price-audit issues for any file that doesn't already have one open
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/generate-price-audit-issues.py
