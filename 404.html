<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page not found — FilmCalc</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <meta name="theme-color" content="#0b0b0c">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --acc: #ff7a2f; }
        body {
            margin: 0; min-height: 100vh; box-sizing: border-box;
            background: #0b0b0c; color: #c9c5bd;
            font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; text-align: center;
        }
        a { color: var(--acc); }
        .code {
            font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700;
            font-size: 15px; letter-spacing: .16em; text-transform: uppercase;
            color: #6d6a64; margin: 0 0 10px;
        }
        h1 {
            font-family: 'Archivo Narrow', Archivo, sans-serif; font-weight: 700;
            letter-spacing: .02em; font-size: 24px; color: #eae7e1; margin: 0 0 12px;
        }
        p { font-size: 14px; color: #b0aeac; margin: 0 0 28px; }
        .home {
            display: inline-block; background: #1c1512; border: 1px solid #5a3a1c; border-radius: 8px;
            padding: 10px 20px; color: var(--acc); font-size: 12px; letter-spacing: .12em;
            text-transform: uppercase; text-decoration: none;
        }
        .home:hover { filter: brightness(1.15); }
    </style>
</head>
<body>
<main>
    <div class="code">404</div>
    <h1>That page doesn't exist</h1>
    <p>The link might be old, or the address was typed wrong. FilmCalc itself is a single page —<br>
    everything lives at the address below.</p>
    <a class="home" href="/">← Back to FilmCalc</a>
</main>
</body>
</html>
