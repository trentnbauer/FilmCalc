label: Common developing chemicals
# Unlike films/*.yaml and labs/*.yaml, this isn't split by region — dev
# chemistry itself doesn't vary by country the way a shop's price does, so
# there's nothing regional to pick between. The app auto-imports this whole
# file once on first run (no setup-wizard step, no opt-in checkbox — see
# init() in js/app.js), and never re-imports it after that, so deleting a
# preset here sticks. Cost is a rough USD street price for one full batch —
# always approximate and meant to be edited after import, not authoritative
# regional pricing like the films/labs presets are.
chemicals:
  - name: Kodak D-76
    process: BW
    dilution: "1+1"
    capacityRolls: 8
    cost: 14
  - name: Kodak T-Max Developer
    process: BW
    dilution: "1+4"
    capacityRolls: 16
    cost: 17
