    process: BW
    dilution: "1+1"
    capacityRolls: 8
    cost: 15
  - name: Ilford Ilfosol 3
    process: BW
    dilution: "1+9"
    capacityRolls: 12
    cost: 16
  - name: Ilford DD-X
